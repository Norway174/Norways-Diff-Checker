[package]
name = "norways-diff-checker"
version = "0.1.4"
description = "Offline comparison desktop application"
authors = ["Norway174"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
similar = "2"
regex = "1"
globset = "0.4"
sha2 = "0.10"
walkdir = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zip = "2"
quick-xml = "0.38"
calamine = "0.31"
lopdf = "0.38"
pdfium-render = { version = "0.9.3", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
ocrs = "0.12.2"
rten = { version = "0.24", default-features = false, features = ["rten_format"] }
heif-oxide = "0.1"
imageproc = { version = "0.27", default-features = false }
csv = "1"
rust_xlsxwriter = "0.93"
docx-rs = "0.4"
kamadak-exif = "0.6"
chrono = { version = "0.4", features = ["serde"] }
ureq = "3"
flate2 = "1"
tar = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

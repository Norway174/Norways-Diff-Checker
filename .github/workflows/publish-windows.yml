name: Build and publish Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Check package version against releases
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & 'scripts/check-release-version.ps1' -Repository 'Norway174/Norways-Diff-Checker' -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.release.outputs.publish == 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.publish == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.release.outputs.publish == 'true'
        with:
          workspaces: src-tauri
      - name: Install NSIS
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build portable app
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NDC_BUILD_COMMIT = $env:GITHUB_SHA
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Checks failed' }
          npm run build:portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
      - name: Package and publish
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS_RELEASE_TAG: ${{ steps.release.outputs.previous_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = $env:GITHUB_SHA.ToLowerInvariant()
          $repo = 'Norway174/Norways-Diff-Checker'
          $tag = $env:RELEASE_TAG
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $work = Join-Path $env:RUNNER_TEMP 'ndc-publish'
          $portable = Join-Path $work 'portable'
          New-Item -ItemType Directory -Path (Join-Path $portable 'licenses') -Force | Out-Null
          Copy-Item 'src-tauri/target/release/norways-diff-checker.exe' (Join-Path $portable 'norways-diff-checker.exe')
          Copy-Item 'src-tauri/binaries/PDFIUM-LICENSE' (Join-Path $portable 'licenses/PDFIUM-LICENSE')
          Copy-Item 'src-tauri/models/LICENSE.md' (Join-Path $portable 'licenses/OCR-LICENSE.md')
          [IO.File]::WriteAllText((Join-Path $portable 'portable.flag'), "portable`n")
          $zip = Join-Path $work 'Portable.zip'
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath $zip -CompressionLevel Optimal
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (!$nsis) { $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe' }
          if (!(Test-Path -LiteralPath $nsis)) { throw 'NSIS compiler not found' }
          $installer = Join-Path $work 'Installer.exe'
          & $nsis "/DAPP_COMMIT=$commit" "/DAPP_VERSION=$version" "/DPORTABLE_DIR=$portable" "/DOUTPUT=$installer" 'installer/Installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installer build failed' }
          $head = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($LASTEXITCODE -ne 0 -or $head -ne $commit) { Write-Host 'A newer source commit exists; skipping this publication.'; exit 0 }
          $notes = Join-Path $work 'release-notes.md'
          & 'scripts/write-release-notes.ps1' -Repository $repo -HeadCommit $commit -PreviousTag $env:PREVIOUS_RELEASE_TAG -OutputPath $notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate release notes' }
          gh release create $tag $zip $installer --repo $repo --target $commit --title $version --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not create GitHub Release' }
